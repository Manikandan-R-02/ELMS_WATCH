# sonar-project.properties
# Local/CI SonarQube (or SonarCloud) scanner configuration for this project.
# Run `npm run test:coverage` before the scanner so coverage/lcov.info exists.

sonar.projectKey=ags-elms-new-template
sonar.projectName=AGS ELMS New Template
sonar.sourceEncoding=UTF-8

# Analyse with the app's real (strict) TypeScript config — the root tsconfig.json only holds project references,
# so without this the analyzer type-checks loosely and reports things like "unnecessary type assertion" wrongly.
sonar.typescript.tsconfigPaths=tsconfig.app.json
sonar.host.url=http://103.73.189.202:9000



# Where the source (and tests, since they live next to the source here) live.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Vitest (via @vitest/coverage-v8) writes an lcov report here — see vitest.config.ts `test.coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Skip test files (scanned as tests, not source), node_modules, build output, and generated files.
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**,**/node_modules/**,**/dist/**,**/*.d.ts,src/index.css

# Auth token is intentionally NOT stored here — set it as an environment
# variable before running `npm run sonar` instead:
# PowerShell: $env:SONAR_TOKEN = "your-token-here"
# bash: export SONAR_TOKEN="your-token-here"
# The scanner picks up SONAR_TOKEN automatically.

# Guided-tour step files are declarative data (one object literal per step, same shape by design),
# so repeated step structure is not code duplication worth merging.
sonar.cpd.exclusions=src/components/onboarding/screenSteps/**
